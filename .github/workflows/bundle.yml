name: bundle

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'wrangler.toml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository had no lockfile. This first run resolves one and uploads it, so the next commit can pin it with npm ci.
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 14
          if-no-files-found: error
      - run: npm run build
      - run: npm run typecheck
      # worker.ts is not in the tsc build, so the Worker tests load the wrangler bundle (out/worker.js), the file that is deployed.
      - name: Bundle the Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir out
      - run: npm test
      - run: ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: out
          retention-days: 14
          if-no-files-found: error
